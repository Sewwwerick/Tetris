<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мини-тетрис</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; display: flex;
         flex-direction: column; align-items: center; justify-content: center;
         height: 100vh; margin: 0; }
  canvas { background: #222; border: 2px solid #555; }
  p { margin: 8px; font-size: 14px; color: #aaa; }
  .pad { text-align: center; }
  .btn { font-size: 22px; margin: 3px; padding: 10px 18px; cursor: pointer;
         background: #333; color: #eee; border: 1px solid #555;
         border-radius: 10px; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="game" width="240" height="480"></canvas>
<div id="score" style="font-size:18px;">Счёт: 0</div>
<div class="pad">
  <div>
    <button class="btn" onclick="press('ArrowLeft')">◀️</button>
    <button class="btn" onclick="press('ArrowUp')">🔄</button>
    <button class="btn" onclick="press('ArrowRight')">▶️</button>
  </div>
  <div>
    <button class="btn" onclick="press('ArrowDown')">⬇️</button>
    <button class="btn" onclick="press('p')">⏸</button>
    <button class="btn" onclick="reset()">🆕</button>
  </div>
</div>
<p>← → — двигать, ↑ — поворот, ↓ — ускорить, R — заново</p>
<script>
const W = 12, H = 24, S = 20; // поле 12x24, клетка 20px
const cv = document.getElementById('game'), ctx = cv.getContext('2d');

const SHAPES = [
  [[1,1,1,1]],                 // I
  [[1,1],[1,1]],               // O
  [[0,1,0],[1,1,1]],           // T
  [[1,0,0],[1,1,1]],           // J
  [[0,0,1],[1,1,1]],           // L
  [[0,1,1],[1,1,0]],           // S
  [[1,1,0],[0,1,1]]            // Z
];
const COLORS = ['#0ff','#ff0','#a0f','#00f','#f80','#0f0','#f00'];

let field, piece, pi, px, py, score, dropTimer, over, paused = false;

// «Мешок» из 7 фигур: перемешиваем и выдаём по очереди —
// каждая фигура (включая линию I) гарантированно появляется регулярно
let bag = [];
function nextShapeIndex() {
  if (!bag.length) {
    bag = SHAPES.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  return bag.pop();
}

function newPiece() {
  pi = nextShapeIndex();
  piece = SHAPES[pi].map(r => [...r]);
  px = Math.floor((W - piece[0].length) / 2);
  py = 0;
  if (collides(px, py)) over = true;
}

function collides(x, y, shape = piece) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[r].length; c++)
      if (shape[r][c] &&
          (x + c < 0 || x + c >= W || y + r >= H ||
           (y + r >= 0 && field[y + r][x + c]))) return true;
  return false;
}

function rotate() {
  const rot = piece[0].map((_, c) => piece.map(row => row[c]).reverse());
  if (!collides(px, py, rot)) piece = rot;
}

function fixPiece() {
  for (let r = 0; r < piece.length; r++)
    for (let c = 0; c < piece[r].length; c++)
      if (piece[r][c] && py + r >= 0) field[py + r][px + c] = pi + 1;
  // удалить заполненные линии
  for (let r = H - 1; r >= 0; r--)
    if (field[r].every(v => v)) { field.splice(r, 1); field.unshift(Array(W).fill(0)); score++; r++; }
  newPiece();
}

function update() {
  if (over || paused) return;
  if (collides(px, py + 1)) fixPiece(); else py++;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    if (field[r][c]) { ctx.fillStyle = COLORS[field[r][c] - 1]; ctx.fillRect(c*S, r*S, S-1, S-1); }
    else { ctx.fillStyle = '#2a2a2a'; ctx.fillRect(c*S, r*S, S-1, S-1); }
  }
  if (!over) {
    ctx.fillStyle = COLORS[pi];
    for (let r = 0; r < piece.length; r++) for (let c = 0; c < piece[r].length; c++)
      if (piece[r][c] && py + r >= 0) ctx.fillRect((px+c)*S, (py+r)*S, S-1, S-1);
  } else if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H*S/2 - 40, cv.width, 80);
    ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif';
    ctx.fillText('Пауза', 84, H*S/2);
  } else {
    ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif';
    ctx.fillText('Конец! R — заново', 20, H*S/2);
  }
  document.getElementById('score').textContent = 'Счёт: ' + score;
}

function togglePause() {
  if (over) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Продолжить' : 'Пауза';
  draw();
}

document.getElementById('pauseBtn').addEventListener('click', togglePause);

function press(key) {
  if (key === 'p') { togglePause(); return; }
  if (over) return;
  if (key === 'ArrowLeft' && !collides(px - 1, py)) px--;
  if (key === 'ArrowRight' && !collides(px + 1, py)) px++;
  if (key === 'ArrowDown') update();
  if (key === 'ArrowUp') rotate();
  draw();
}

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') reset();
  if (e.key.startsWith('Arrow')) { e.preventDefault(); press(e.key); }
});

function reset() {
  field = Array.from({length: H}, () => Array(W).fill(0));
  bag = [];
  score = 0; over = false; dropTimer = 0; paused = false;
  document.getElementById('pauseBtn').textContent = 'Пауза';
  newPiece();
}

setInterval(() => { update(); draw(); }, 400); // падение раз в 0.4с
reset(); draw();
</script>
</body>
</html>
